<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MathPath - Learning Mathematics Together</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Language Switcher Bar -->
    <div id="lang-bar"></div>

    <!-- Page Views Container -->
    <div id="page-container">
      <div class="page" id="page-welcome"></div>
      <div class="page" id="page-home"></div>
      <div class="page" id="page-topics"></div>
      <div class="page" id="page-lesson"></div>
      <div class="page" id="page-practice"></div>
      <div class="page" id="page-result"></div>
      <div class="page" id="page-progress"></div>
      <div class="page" id="page-admin"></div>
    </div>

    <!-- Bottom / Top Navigation Bar -->
    <nav id="nav-bar"></nav>
  </div>

  <!-- Application Scripts -->
  <script src="js/data.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initApp();
    });
  </script>
</body>
</html>
